[package]
name = "droidnote"
version = "2.2.0"
description = "DroidNote desktop shell"
authors = ["Droidwerk"]
edition = "2021"

[lib]
name = "droidnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Os caminhos absolutos da máquina de build são removidos por
# CARGO_ENCODED_RUSTFLAGS em installer/build-windows.ps1. `strip` não resolve:
# eles ficam como literais de string, não como símbolos. `trim-paths` ainda é
# instável no cargo estável.
