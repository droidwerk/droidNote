name: Release

# Cada push na main vira uma versão nova para os usuários.
# [release minor] ou [release major] na mensagem escolhe o número; [skip release] pula.
on:
  push:
    branches: [main]
    # Só documentação (ou a assinatura do CLA pelo bot) não vira versão nova.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/pull-requests.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: Parte da versão que sobe
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.base.outputs.sha }}
      part: ${{ steps.part.outputs.part }}
      version: ${{ steps.bump.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      # A main atual, e não o commit do evento: assim a execução que estava na
      # fila já parte da versão que a anterior publicou.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Commit base
        id: base
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Notas do changelog
        run: |
          python scripts/release_changelog.py --check
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::CHANGELOG.md sem entradas em Unreleased; a release sai sem notas" }
          exit 0

      - name: Testes do backend
        working-directory: backend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Escolher a parte da versão
        id: part
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $part = "patch"
          if ($env:INPUT_BUMP) { $part = $env:INPUT_BUMP }
          elseif ($env:MESSAGE -match '\[release major\]') { $part = "major" }
          elseif ($env:MESSAGE -match '\[release minor\]') { $part = "minor" }
          "part=$part" >> $env:GITHUB_OUTPUT

      - name: Subir a versão
        id: bump
        env:
          PART: ${{ steps.part.outputs.part }}
        run: python installer/bump_version.py $env:PART

      - name: Gerar o instalador
        run: ./installer/build-windows.ps1

      - name: Juntar os instaladores
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          $nsis = "desktop/src-tauri/target/release/bundle/nsis/DroidNote_${env:VERSION}_x64-setup.exe"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          foreach ($file in @("DroidNote-Setup.exe", $nsis)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Instalador ausente: $file" }
            Copy-Item -LiteralPath $file -Destination out
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Só este job escreve no repositório, e não roda código de dependências.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - name: Subir a versão no mesmo commit do build
        env:
          PART: ${{ needs.build.outputs.part }}
          BUILT: ${{ needs.build.outputs.version }}
        run: |
          version=$(python3 installer/bump_version.py "$PART")
          if [ "$version" != "$BUILT" ]; then
            echo "Versão $version diferente da compilada ($BUILT)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installers
          path: out

      - name: Commit da versão e tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/release_changelog.py "$VERSION" --notes out/notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md backend/app/__init__.py backend/pyproject.toml desktop/package.json desktop/package-lock.json desktop/src-tauri/tauri.conf.json desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock desktop/src/pages/AboutPage.tsx
          git commit -m "release: DroidNote $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "DroidNote $VERSION"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd out && sha256sum DroidNote-Setup.exe "DroidNote_${VERSION}_x64-setup.exe" > SHA256SUMS.txt)
          gh release create "v$VERSION" \
            "out/DroidNote-Setup.exe" \
            "out/DroidNote_${VERSION}_x64-setup.exe" \
            "out/SHA256SUMS.txt" \
            "install.ps1" \
            --title "DroidNote $VERSION" \
            --notes-file out/notes.md \
            --latest
