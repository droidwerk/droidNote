[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "droidnote"
license = "AGPL-3.0-only"
version = "2.3.1"
description = "Assistente local de gravações — transcrição e resumo 100% no dispositivo."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "aiosqlite>=0.20.0",
  "numpy>=2.0.0",
  "httpx>=0.27.0",
  "soundcard>=0.4.3",
  "faster-whisper>=1.1.0",
  "reportlab>=4.2.0",
  "pillow>=13",
  # Puxado pelo requests (langchain): versões antigas têm CVEs abertas.
  "urllib3>=2.8",
  # Transitivas que vão no instalador: mínimos sem CVE aberta (pip-audit, nov/2026).
  "certifi>=2026.10.18",
  "filelock>=4.2.1",
  "python-docx>=1.1.0",
  "python-dateutil>=2.8.2",
  "tzdata>=2024.1",
  # Documentos no chat (lidos neste PC).
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",
  "pypdf>=5",
  "docx2txt>=0.8",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  # Links do YouTube no chat: título e legendas (ou só o áudio, sem legenda).
  "yt-dlp>=2025.10.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "pyinstaller>=6.11.0",
  # `uv run pip-audit`: confere o uv.lock contra as bases de CVE.
  "pip-audit>=2.9",
]

[project.scripts]
droidnote-backend = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
