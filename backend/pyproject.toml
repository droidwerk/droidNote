[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droidnote"
version = "2.1.0"
description = "Assistente local de gravações — transcrição e resumo 100% no dispositivo."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "aiosqlite>=0.20.0",
  "numpy>=2.0.0",
  "httpx>=0.27.0",
  "soundcard>=0.4.3",
  "faster-whisper>=1.1.0",
  "reportlab>=4.2.0",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "pyinstaller>=6.11.0",
]

[project.scripts]
droidnote-backend = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
